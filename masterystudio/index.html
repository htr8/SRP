<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mastery Studio</title>
    <base href="/SRP/masterystudio/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="_content/MasteryCoach.UI/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MasteryCoach.Web.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        <div class="error-title">An unhandled error has occurred.</div>
        <pre id="blazor-error-detail" class="error-detail"></pre>
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Error bar + diagnostics-log bridge; shared with the MAUI head. -->
    <script src="_content/MasteryCoach.UI/js/errorCapture.js"></script>
    <!-- Gesture-anchored AudioContext unlock (iOS silence fix); must load before Blazor. -->
    <script src="_content/MasteryCoach.UI/js/audioUnlock.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
