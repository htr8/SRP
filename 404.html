<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Mastery Studio</title>
    <script>
        (function () {
            var repoBase = '/SRP/';
            var devBase = '/SRP/masterystudio-dev/';
            var origin = window.location.origin;
            var path = window.location.pathname;
            var hash = window.location.hash || '';
            var query = window.location.search
                ? '&' + window.location.search.slice(1).replace(/&/g, '~and~')
                : '';

            function redirect(base, route) {
                window.location.replace(origin + base + '?/' + route.replace(/&/g, '~and~') + query + hash);
            }

            if (path.indexOf(devBase) === 0) {
                redirect(devBase, path.slice(devBase.length));
                return;
            }

            if (path.indexOf(repoBase) === 0) {
                redirect(repoBase, path.slice(repoBase.length));
                return;
            }

            redirect(repoBase, path.replace(/^\/+/, ''));
        }());
    </script>
</head>
<body></body>
</html>
