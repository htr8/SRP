<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Mastery Studio</title>
    <script>
        (function () {
            var repoBase = '/SRP/';                     // '/SRP/'
            var previewParent = repoBase + 'masterystudio/'; // '/SRP/masterystudio/'
            var origin = window.location.origin;
            var path = window.location.pathname;
            var hash = window.location.hash || '';
            var query = window.location.search
                ? '&' + window.location.search.slice(1).replace(/&/g, '~and~')
                : '';

            function redirect(base, route) {
                window.location.replace(origin + base + '?/' + route.replace(/&/g, '~and~') + query + hash);
            }

            // A deep link into a named preview: /SRP/masterystudio/<name>/<route...>. The app base is
            // everything up to and including the <name> segment, derived from the URL - so this works for
            // ANY preview name without listing them here.
            if (path.indexOf(previewParent) === 0) {
                var rest = path.slice(previewParent.length);   // '<name>/<route...>'
                var slash = rest.indexOf('/');
                if (slash > 0) {
                    var previewBase = previewParent + rest.slice(0, slash) + '/';
                    redirect(previewBase, rest.slice(slash + 1));
                    return;
                }
                // '/SRP/masterystudio/<name>' with no trailing slash/route -> that preview's root.
                if (rest.length > 0) {
                    redirect(previewParent + rest + '/', '');
                    return;
                }
                // Bare '/SRP/masterystudio/' -> fall through to the live root app.
            }

            if (path.indexOf(repoBase) === 0) {
                redirect(repoBase, path.slice(repoBase.length));
                return;
            }

            redirect(repoBase, path.replace(/^\/+/, ''));
        }());
    </script>
</head>
<body></body>
</html>
