<body>
    <!-- Portal for ReportPreviewModal — direct child of body so position:fixed
         is never clipped by overflow:hidden ancestors (WebView2/WKWebView bug). -->
    <div id="report-modal-portal"></div>

    <script>
        // Return bounding rect of an element reference — used by SelectInput fixed positioning.
        window.getElementRect = function (el) {
            if (!el) return { bottom: 0, left: 0, width: 200 };
            var r = el.getBoundingClientRect();
            return { bottom: r.bottom, left: r.left, width: r.width };
        };

        // Return bounding rect of a DOM element by ID — used by FirstRunTour spotlight positioning.
        window.srGetElementRect = function (id) {
            var el = document.getElementById(id);
            if (!el) return null;
            var r = el.getBoundingClientRect();
            return { top: r.top, left: r.left, width: r.width, height: r.height, bottom: r.bottom, right: r.right };
        };

        // Dropdown portal: when a SelectInput opens, move its menu into a fixed
        // portal so it escapes all overflow:hidden/auto ancestors.
        // NOTE: The menu is always rendered in the DOM (hidden via CSS class) to
        // avoid Blazor removeChild errors when the portal has moved the element.
        // We detect open/close via the sel-input--open class on the parent.
        (function () {
            var portal = document.createElement('div');
            portal.id = 'dropdown-portal';
            portal.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;z-index:99999;';
            document.body.appendChild(portal);

            var activeMenu = null;
            var activeSource = null;

            function positionMenu(menu, trigger) {
                var r = trigger.getBoundingClientRect();
                menu.style.position = 'fixed';
                menu.style.top = (r.bottom + 2) + 'px';
                menu.style.left = r.left + 'px';
                menu.style.minWidth = r.width + 'px';
                requestAnimationFrame(function () {
                    if (!menu.parentNode) return;
                    var mr = menu.getBoundingClientRect();
                    if (mr.bottom > window.innerHeight - 8) {
                        menu.style.top = (r.top - mr.height - 2) + 'px';
                    }
                });
            }

            new MutationObserver(function (mutations) {
                mutations.forEach(function (m) {
                    if (m.type !== 'attributes' || m.attributeName !== 'class') return;
                    var el = m.target;
                    if (!el.classList || !el.classList.contains('sel-input')) return;

                    if (el.classList.contains('sel-input--open')) {
                        var menu = el.querySelector('.sel-input__menu');
                        var trigger = el.querySelector('.sel-input__trigger');
                        if (!menu || !trigger) return;
                        if (activeMenu) cleanup();
                        activeSource = menu.parentNode;
                        activeMenu = menu;
                        menu.classList.remove('sel-input__menu--hidden');
                        portal.appendChild(menu);
                        positionMenu(menu, trigger);
                    } else if (activeMenu) {
                        cleanup();
                    }
                });
            }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });

            function cleanup() {
                if (activeMenu) {
                    if (activeSource && activeMenu.parentNode === portal) {
                        activeSource.appendChild(activeMenu);
                    }
                    activeMenu.style.position = '';
                    activeMenu.style.top = '';
                    activeMenu.style.left = '';
                    activeMenu.style.minWidth = '';
                }
                activeMenu = null;
                activeSource = null;
            }
        })();

        // Tooltip portal: on hover/tap, clone the tooltip box into a top-level container
        // so it escapes ALL overflow:hidden/auto ancestors.
        // Flips below the icon when too close to the viewport top edge.
        (function () {
            var portal = document.createElement('div');
            portal.id = 'tooltip-portal';
            portal.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;z-index:99999;pointer-events:none;';
            document.body.appendChild(portal);

            var activeBox = null;
            var activeIcon = null;

            function showPortal(icon) {
                var tooltip = icon.closest('.info-tooltip');
                if (!tooltip) { removeActive(); return; }
                var srcBox = tooltip.querySelector('.info-tooltip__box');
                if (!srcBox) return;

                removeActive();
                activeIcon = icon;

                activeBox = srcBox.cloneNode(true);
                activeBox.style.visibility = 'visible';
                activeBox.style.opacity = '1';
                activeBox.style.position = 'fixed';
                activeBox.style.pointerEvents = 'none';
                activeBox.style.width = '240px';
                portal.appendChild(activeBox);

                var r = icon.getBoundingClientRect();
                var cx = r.left + r.width / 2;
                var boxHeight = activeBox.offsetHeight || 120;
                var spaceAbove = r.top;

                if (spaceAbove < boxHeight + 20) {
                    activeBox.style.top = (r.bottom + 12) + 'px';
                    activeBox.style.left = cx + 'px';
                    activeBox.style.transform = 'translateX(-50%)';
                } else {
                    activeBox.style.top = (r.top - 12) + 'px';
                    activeBox.style.left = cx + 'px';
                    activeBox.style.transform = 'translateX(-50%) translateY(-100%)';
                }

                var bRect = activeBox.getBoundingClientRect();
                if (bRect.left < 8) {
                    activeBox.style.left = (cx - bRect.left + 8) + 'px';
                } else if (bRect.right > window.innerWidth - 8) {
                    activeBox.style.left = (cx - (bRect.right - window.innerWidth) - 8) + 'px';
                }
            }

            document.addEventListener('mouseover', function (e) {
                var icon = e.target.closest('.info-tooltip__icon');
                if (!icon) { removeActive(); return; }
                showPortal(icon);
            });

            document.addEventListener('mouseout', function (e) {
                var icon = e.target.closest('.info-tooltip__icon');
                if (icon) removeActive();
            });

            // Mobile: tap to toggle
            document.addEventListener('touchstart', function (e) {
                var icon = e.target.closest('.info-tooltip__icon');
                if (icon) {
                    if (activeIcon === icon) { removeActive(); return; }
                    showPortal(icon);
                    return;
                }
                if (activeBox) removeActive();
            });

            function removeActive() {
                if (activeBox) { portal.removeChild(activeBox); activeBox = null; }
                activeIcon = null;
            }
        })();

        // Browser file download helper for WebFileSaveService.
        // Blazor WASM marshals byte[] to JS as a base64 string, not a Uint8Array,
        // so we must decode it before constructing the Blob.
        window.downloadFile = function(filename, bytes) {
            var data = typeof bytes === 'string'
                ? Uint8Array.from(atob(bytes), function(c) { return c.charCodeAt(0); })
                : new Uint8Array(bytes);
            var blob = new Blob([data], { type: 'application/octet-stream' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };
    </script>

    <script>
    // WebCrypto-based ECDSA-P256 license key verification.
    // Called from EcdsaLicenseValidator via IJSRuntime.
    // .NET's ECDsa class is unsupported on 'browser' — browser WebCrypto is used instead.
    //
    // IMPORTANT: The signature is computed over the UTF-8 bytes of the base64url-encoded
    // payload string (NOT the decoded JSON bytes). This matches the Tester's KeySigner.cs logic.
    window.srVerifyLicenseKey = async function(payloadB64Url, sigB64Url, pubKeyB64) {
        try {
            const dec64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
            const stringToBytes = s => Uint8Array.from(new TextEncoder().encode(s));

            const cryptoKey = await crypto.subtle.importKey(
                'spki', dec64(pubKeyB64),
                { name: 'ECDSA', namedCurve: 'P-256' },
                false, ['verify']);

            // Sign the base64url string itself (as UTF-8 bytes), not the decoded payload
            const payloadBytes = stringToBytes(payloadB64Url);
            const sig = dec64(sigB64Url.replace(/-/g, '+').replace(/_/g, '/').padEnd(sigB64Url.length + (4 - sigB64Url.length % 4) % 4, '='));

            return await crypto.subtle.verify(
                { name: 'ECDSA', hash: 'SHA-256' },
                cryptoKey, sig, payloadBytes);
        } catch (e) { console.error('[SR] verify error:', e); return false; }
    };

    // Auto-focus .db-modal-backdrop elements when added to DOM, enabling @onkeydown (Esc to close).
    // Blazor's JS interop focusElement call is not reliable when the element is conditionally rendered.
    window.srObserveModalFocus = function() {
        // Selectors for focusable modal containers that use @onkeydown for Esc.
        var FOCUSABLE = '.db-modal-backdrop[tabindex], .db-modal[tabindex], .help-modal[tabindex], .dropdown-backdrop[tabindex]';
        function focusFirst(root) {
            if (!root || root.nodeType !== 1) return;
            var els = root.matches && root.matches(FOCUSABLE) ? [root]
                    : Array.from(root.querySelectorAll ? root.querySelectorAll(FOCUSABLE) : []);
            els.forEach(function(el) { setTimeout(function() { el.focus(); }, 0); });
        }
        new MutationObserver(function(mutations) {
            mutations.forEach(function(m) {
                m.addedNodes.forEach(focusFirst);
            });
        }).observe(document.body, { childList: true, subtree: true });
    };
    </script>
    <!-- iOS variant: unregister any stale COI service worker from the desktop
         /SRP/ path (same scope covers /SRP/ios/), then load Blazor directly.
         WasmFingerprintAssets=false means framework files have stable names, so
         a live SW would serve stale cached builds causing "unhandled error". -->
    <script>
    (async function() {
        if ("serviceWorker" in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            var stale = regs.filter(function(r) {
                return r.active && r.active.scriptURL.includes("coi-serviceworker");
            });
            if (stale.length > 0) {
                await Promise.all(stale.map(function(r) { return r.unregister(); }));
                location.reload();
                return;
            }
        }
        var s = document.createElement("script");
        s.src = "_framework/blazor.webassembly.js";
        document.body.appendChild(s);
    })();
    </script>
